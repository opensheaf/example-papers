  title: "Counting stabiliser codes for arbitrary dimension"
  authors:
    - "Singal, Tanmay|Institute of Physics, Faculty of Physics, Astronomy and Informatics, Nicolaus Copernicus University, Grudziadzka 5/7, 87-100 Toru\u0144, Poland"
    - "Chiang, Che|Department of Physics and Center for Theoretical Physics, National Taiwan University, Taipei 10617, Taiwan"
    - "Hsu, Eugene|Quantum information center, Chung Yuan Christian University, No. 200, Zhongbei Rd., Zhongli Dist., Taoyuan City 320314, Taiwan"
    - "Kim, Eunsang|Department of mathematical Data Science, Hanyang University, Ansan, Gyeonggi-do, 15588, Korea"
    - "Goan, Hsi-Sheng|Department of Physics and Center for Theoretical Physics, National Taiwan University, Taipei 10617, Taiwan"
    - "Hsieh, Min-Hsiu|Hon Hai Quantum Computing Research Center, Taipei, Taiwan"
  abstract: "In this work, we compute the number of [[n,k]]d stabilizer codes made up of d-dimensional qudits, for arbitrary positive integers d. In a seminal work by Gross \\cite{Gross2006} the number of [[n,k]]d stabilizer codes was computed for the case when d is a prime (or the power of a prime, i.e., d=pm, but when the qudits are Galois-qudits). The proof in \\cite{Gross2006} is inapplicable to the non-prime case. For our proof, we introduce a group structure to [[n,k]]d codes, and use this in conjunction with the Chinese remainder theorem to count the number of [[n,k]]d codes. Our work overlaps with \\cite{Gross2006} when d is a prime and in this case our results match exactly, but the results differ for the more generic case. Despite that, the overall order of magnitude of the number of stabilizer codes scales agnostic of whether the dimension is prime or non-prime. This is surprising since the method employed to count the number of stabilizer states (or more generally stabilizer codes) depends on whether d is prime or not. The cardinality of stabilizer states, which was so far known only for the prime-dimensional case (and the Galois qudit prime-power dimensional case) plays an important role as a quantifier in many topics in quantum computing. Salient among these are the resource theory of magic, design theory, de Finetti theorem for stabilizer states, the study and optimisation of the classical simulability of Clifford circuits, the study of quantum contextuality of small-dimension"
